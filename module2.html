<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module 2 — Data Entry & Formatting</title>
<style>
:root{--navy:#17324d;--green:#1f7a5a;--light:#eef8f3;--bg:#f6f8fa;--white:#fff;--line:#dbe4eb;--muted:#64748b;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Arial,Helvetica,sans-serif;line-height:1.55}
header{background:var(--navy);color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.brand{font-weight:800}.module-label{font-size:.9rem;opacity:.85}
.layout{display:grid;grid-template-columns:285px 1fr;max-width:1250px;margin:auto;min-height:calc(100vh - 70px)}
aside{background:white;border-right:1px solid var(--line);padding:25px 18px;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}
aside h3{margin:0 0 15px}.lesson-btn{width:100%;text-align:left;border:0;background:white;padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer;color:var(--navy)}
.lesson-btn:hover{background:#f1f6f4}.lesson-btn.active{background:var(--light);color:var(--green);font-weight:800}.lesson-btn.done:before{content:"✓ ";color:var(--green);font-weight:bold}
.progress-wrap{margin:15px 0 22px}.progress{height:9px;background:#e8edf1;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:var(--green);transition:.3s}
main{padding:42px 6%;max-width:950px;width:100%;margin:auto}
.eyebrow{text-transform:uppercase;letter-spacing:1.2px;color:var(--green);font-size:.8rem;font-weight:800}
h1{font-size:2.6rem;line-height:1.1;margin:8px 0 14px}h2{font-size:1.7rem;margin-top:0}h3{margin-top:0}
.lead{color:var(--muted);font-size:1.08rem}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:25px;margin:20px 0;box-shadow:0 8px 25px #17324d0b}
.callout{background:var(--light);border-left:5px solid var(--green);padding:17px;border-radius:8px;margin:20px 0}
table{width:100%;border-collapse:collapse;margin:18px 0}th,td{padding:11px;border:1px solid var(--line);text-align:left}th{background:#f2f5f7}
pre{background:#132536;color:white;padding:15px;border-radius:9px;overflow:auto}
.option{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);padding:11px 13px;border-radius:8px;margin:8px 0;cursor:pointer}.option:hover{border-color:var(--green)}.option.selected{border-color:var(--green);background:var(--light)}
.feedback{margin-top:10px;font-weight:700}.correct{color:var(--green)}.incorrect{color:var(--danger)}
input[type=text],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:1rem}
button.primary,.nav-actions button{background:var(--green);color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:800;cursor:pointer}
button.secondary{background:white;color:var(--green);border:1px solid var(--green);border-radius:8px;padding:11px 17px;font-weight:800;cursor:pointer}
.nav-actions{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.color-demo{padding:16px;border-radius:8px;border:1px solid var(--line);background:#fff}
.demo-header{font-weight:800;background:#e6f4ee;padding:12px;border-radius:7px}
.currency{font-weight:700}.negative{color:#b42318}
.quiz-score{font-size:1.3rem;font-weight:800;margin-top:18px}.completion{display:none;text-align:center;background:var(--light);padding:25px;border-radius:14px;margin-top:25px}.completion.show{display:block}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line)}header{position:relative}main{padding:30px 5%}h1{font-size:2.1rem}}
</style>
</head>
<body>
<header><div class="brand">📊 Google Sheets Learning Hub</div><div class="module-label">Module 2 · Data Entry & Formatting</div></header>
<div class="layout">
<aside>
<h3>Module 2</h3>
<div class="progress-wrap"><div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:7px"><span>Progress</span><b id="progressText">0%</b></div><div class="progress"><div class="bar" id="progressBar"></div></div></div>
<div id="lessonNav"></div>
</aside>
<main id="content"></main>
</div>

<script>
const lessons=[
{id:"2.1",title:"Entering Data Correctly"},
{id:"2.2",title:"Text, Numbers & Dates"},
{id:"2.3",title:"Number Formats"},
{id:"2.4",title:"Formatting for Readability"},
{id:"2.5",title:"Rows, Columns & Alignment"},
{id:"2.6",title:"Copy, Fill & Paste"},
{id:"2.7",title:"Practice Project"},
{id:"2.8",title:"Module Quiz"}
];
let current=0, completed=JSON.parse(localStorage.getItem("gsModule2Completed")||"[]");

const pages={
"2.1":`<span class="eyebrow">Lesson 2.1</span><h1>Entering Data Correctly</h1><p class="lead">Good analysis starts with good data entry. Learn how to enter information consistently.</p>
<div class="card"><h2>🎯 Learning Objectives</h2><ul><li>Enter text, numbers and dates into cells.</li><li>Understand why consistent data entry matters.</li><li>Build a simple structured table.</li></ul></div>
<div class="card"><h2>📖 Learn</h2><p>When entering data, each <b>row</b> should normally represent one record and each <b>column</b> should represent one field.</p><table><tr><th>Order ID</th><th>Product</th><th>Region</th><th>Sales</th></tr><tr><td>1001</td><td>Laptop</td><td>Manila</td><td>50000</td></tr><tr><td>1002</td><td>Phone</td><td>Davao</td><td>30000</td></tr></table><div class="callout"><b>Good practice:</b> Keep one type of information in each column. Avoid mixing sales values with notes or headings.</div></div>
<div class="card"><h2>🧩 Practice</h2><p>Which table is easier to analyze?</p><button class="option" onclick="check(this,true,'q21')">A. One row per transaction with separate columns</button><button class="option" onclick="check(this,false,'q21')">B. Several transactions typed into one cell</button><div id="q21" class="feedback"></div></div>
<div class="card"><h2>💻 Try It</h2><p>Create columns for <b>Order ID, Product, Region, Sales</b> and enter five transactions.</p><button class="primary" onclick="markCurrent()">Mark Lesson Complete</button></div>`,

"2.2":`<span class="eyebrow">Lesson 2.2</span><h1>Text, Numbers & Dates</h1><p class="lead">Google Sheets treats different kinds of data differently. Recognizing the type helps prevent calculation and analysis problems.</p>
<div class="card"><h2>📖 Learn</h2><table><tr><th>Data Type</th><th>Example</th><th>Typical Use</th></tr><tr><td>Text</td><td>Laptop</td><td>Product name</td></tr><tr><td>Number</td><td>50000</td><td>Sales amount</td></tr><tr><td>Date</td><td>9/24/2026</td><td>Transaction date</td></tr><tr><td>Percentage</td><td>25%</td><td>Profit margin</td></tr></table><p>A value that looks like a number but is stored as text may not behave correctly in calculations.</p></div>
<div class="card"><h2>🧠 Quick Check</h2><p>Which is most appropriate for a transaction date?</p><button class="option" onclick="check(this,false,'q22')">A. Laptop</button><button class="option" onclick="check(this,true,'q22')">B. 09/24/2026</button><button class="option" onclick="check(this,false,'q22')">C. 50000</button><div id="q22" class="feedback"></div></div>
<div class="card"><h2>💻 Try It</h2><p>Create columns for Product, Sales and Date. Enter five records and use actual dates for the Date column.</p><button class="primary" onclick="markCurrent()">Mark Lesson Complete</button></div>`,

"2.3":`<span class="eyebrow">Lesson 2.3</span><h1>Number Formats</h1><p class="lead">Formatting changes how a value is displayed without necessarily changing the underlying value.</p>
<div class="card"><h2>💰 Common Number Formats</h2><table><tr><th>Format</th><th>Example</th><th>Use</th></tr><tr><td>Number</td><td>50,000.00</td><td>General quantities</td></tr><tr><td>Currency</td><td>₱50,000.00</td><td>Money</td></tr><tr><td>Percent</td><td>25.0%</td><td>Rates and margins</td></tr><tr><td>Date</td><td>Sep 24, 2026</td><td>Dates</td></tr></table></div>
<div class="card"><h2>👀 See It</h2><p>The value <b>0.25</b> can be displayed as:</p><div class="color-demo"><div>Number: <b>0.25</b></div><div>Percentage: <b>25%</b></div></div><p>The displayed format helps the reader understand what the number represents.</p></div>
<div class="card"><h2>🧩 Practice</h2><p>Which format is appropriate for a profit margin?</p><button class="option" onclick="check(this,false,'q23')">A. Currency</button><button class="option" onclick="check(this,true,'q23')">B. Percentage</button><button class="option" onclick="check(this,false,'q23')">C. Date</button><div id="q23" class="feedback"></div><button class="primary" style="margin-top:12px" onclick="markCurrent()">Mark Lesson Complete</button></div>`,

"2.4":`<span class="eyebrow">Lesson 2.4</span><h1>Formatting for Readability</h1><p class="lead">A clean spreadsheet helps people understand the information quickly.</p>
<div class="card"><h2>🎨 Useful Formatting Tools</h2><ul><li>Bold and font size</li><li>Fill color</li><li>Text color</li><li>Borders</li><li>Alignment</li><li>Number formatting</li><li>Wrap text</li></ul><div class="demo-header">Order ID · Product · Region · Sales</div></div>
<div class="card"><h2>💼 Professional Tip</h2><p>Use formatting to create a visual hierarchy. Headers should be easy to identify, but avoid decorating every cell. The goal is <b>clarity</b>, not decoration.</p></div>
<div class="card"><h2>💻 Guided Practice</h2><ol><li>Make the header bold.</li><li>Add a subtle fill to the header.</li><li>Add borders to the table.</li><li>Format Sales as currency.</li><li>Wrap long text if necessary.</li></ol><button class="primary" onclick="markCurrent()">Mark Lesson Complete</button></div>`,

"2.5":`<span class="eyebrow">Lesson 2.5</span><h1>Rows, Columns & Alignment</h1><p class="lead">Learn to control the physical layout of your worksheet.</p>
<div class="card"><h2>📐 Learn</h2><ul><li><b>Resize:</b> drag the boundary between column letters or row numbers.</li><li><b>Auto-fit:</b> adjust a column to fit its contents.</li><li><b>Alignment:</b> control how values sit inside cells.</li><li><b>Wrap text:</b> display long content on multiple lines.</li></ul></div>
<div class="card"><h2>🧩 Practice</h2><p>Suppose a Customer Name column contains long names and a Sales column contains numbers. What should you do?</p><button class="option" onclick="check(this,true,'q25')">A. Widen the customer column and use suitable alignment</button><button class="option" onclick="check(this,false,'q25')">B. Delete the names</button><button class="option" onclick="check(this,false,'q25')">C. Put everything in one column</button><div id="q25" class="feedback"></div><button class="primary" style="margin-top:12px" onclick="markCurrent()">Mark Lesson Complete</button></div>`,

"2.6":`<span class="eyebrow">Lesson 2.6</span><h1>Copy, Fill & Paste</h1><p class="lead">These tools save time when entering repeated or sequential information.</p>
<div class="card"><h2>📖 Learn</h2><p>You can copy and paste values or formulas. The fill handle can extend patterns such as:</p><table><tr><th>Starting values</th><th>Possible continuation</th></tr><tr><td>1, 2</td><td>3, 4, 5...</td></tr><tr><td>Jan, Feb</td><td>Mar, Apr...</td></tr><tr><td>Monday, Tuesday</td><td>Wednesday, Thursday...</td></tr></table></div>
<div class="card"><h2>🧩 Practice</h2><p>Enter <b>1</b> in one cell and <b>2</b> in the next. Select both and drag the fill handle. What should Sheets continue?</p><button class="option" onclick="check(this,true,'q26')">A. 3, 4, 5...</button><button class="option" onclick="check(this,false,'q26')">B. 1, 1, 1...</button><button class="option" onclick="check(this,false,'q26')">C. 2, 2, 2...</button><div id="q26" class="feedback"></div></div>
<div class="card"><h2>💡 Tip</h2><p>Always check what was copied before using a filled range in important work.</p><button class="primary" onclick="markCurrent()">Mark Lesson Complete</button></div>`,

"2.7":`<span class="eyebrow">Lesson 2.7</span><h1>Module Practice Project</h1><p class="lead">Create a clean sales table using the data-entry and formatting skills from Module 2.</p>
<div class="card"><h2>💼 Business Scenario</h2><p>You are preparing a sales file that will later be analyzed by a data analyst. Your job is to make the raw information consistent and readable.</p>
<table><tr><th>Order ID</th><th>Date</th><th>Product</th><th>Region</th><th>Sales</th></tr><tr><td>1001</td><td>09/01/2026</td><td>Laptop</td><td>Manila</td><td>50000</td></tr><tr><td>1002</td><td>09/03/2026</td><td>Phone</td><td>Davao</td><td>30000</td></tr><tr><td>1003</td><td>09/06/2026</td><td>Tablet</td><td>Cebu</td><td>25000</td></tr><tr><td>1004</td><td>09/10/2026</td><td>Monitor</td><td>Manila</td><td>20000</td></tr><tr><td>1005</td><td>09/12/2026</td><td>Keyboard</td><td>Davao</td><td>8000</td></tr><tr><td>1006</td><td>09/15/2026</td><td>Mouse</td><td>Cebu</td><td>5000</td></tr></table></div>
<div class="card"><h2>✅ Student Tasks</h2><ol><li>Create a sheet named <b>Sales_Data</b>.</li><li>Enter all six transactions.</li><li>Format Date as a date.</li><li>Format Sales as Philippine currency.</li><li>Make the header bold with a subtle fill.</li><li>Add borders.</li><li>Resize columns for readability.</li><li>Freeze row 1.</li><li>Use consistent capitalization for Product and Region.</li></ol></div>
<div class="card"><h2>🔍 Self-Check</h2><p>Your finished table should be easy to scan, with dates displayed consistently and sales clearly shown as money.</p><button class="primary" onclick="markCurrent()">Mark Practice Complete</button></div>`,

"2.8":`<span class="eyebrow">Lesson 2.8</span><h1>Module 2 Final Quiz</h1><p class="lead">You need at least 80% to pass this module.</p><div id="quiz"></div><button class="primary" onclick="gradeQuiz()">Submit Quiz</button><div id="score" class="quiz-score"></div><div id="completion" class="completion"><h2>🎉 Module 2 Complete!</h2><p>You have completed Data Entry & Formatting.</p><p><b>Next:</b> Module 3 — Formulas & Essential Functions</p></div>`
};

const quiz=[
["In a structured dataset, what should a row usually represent?","One record or transaction",["One record or transaction","A whole workbook","A formatting color","A formula only"],0],
["Which is best for a transaction date?","A real date value",["A random text label","A real date value","A currency value","A product name"],1],
["Which format is appropriate for ₱50,000?","Currency",["Date","Currency","Percentage","Plain text only"],1],
["Which format is appropriate for 25%?","Percentage",["Currency","Date","Percentage","Order ID"],2],
["Why format a header?","To make the table easier to read",["To hide the data","To delete formulas","To make the file smaller"],0],
["What does wrap text help with?","Displaying long content within a cell",["Deleting content","Changing a date to currency","Sorting automatically"],0],
["What is a useful reason to resize columns?","To make information readable",["To remove data","To create a password","To change formulas"],0],
["What can the fill handle help create?","Sequences and copied patterns",["Only charts","Only passwords","Only new files"],0],
["Why is consistent data entry important?","It makes later analysis more reliable",["It prevents all formulas","It changes the computer","It makes every cell a chart"],0],
["Which is a good spreadsheet design principle?","Use formatting for clarity rather than decoration",["Use a different style for every cell","Hide all headers","Put multiple fields into one cell"],0]
];

function renderNav(){document.getElementById("lessonNav").innerHTML=lessons.map((l,i)=>`<button class="lesson-btn" id="nav-${l.id}" onclick="openLesson(${i})">${l.id} · ${l.title}</button>`).join("")}
function openLesson(i){current=i;let l=lessons[i];document.getElementById("content").innerHTML=pages[l.id];document.querySelectorAll(".lesson-btn").forEach(x=>x.classList.remove("active"));document.getElementById("nav-"+l.id).classList.add("active");if(l.id==="2.8")renderQuiz();updateProgress();window.scrollTo({top:0,behavior:"smooth"})}
function check(btn,correct,id){document.querySelectorAll(".option").forEach(b=>{if(b.parentElement===btn.parentElement)b.classList.remove("selected")});btn.classList.add("selected");let box=document.getElementById(id);box.textContent=correct?"✓ Correct!":"✗ Not quite. Review the explanation and try again.";box.className="feedback "+(correct?"correct":"incorrect")}
function markCurrent(){let id=lessons[current].id;if(!completed.includes(id))completed.push(id);localStorage.setItem("gsModule2Completed",JSON.stringify(completed));updateProgress();alert("Lesson completed! Your progress has been saved on this browser.")}
function updateProgress(){lessons.forEach(l=>document.getElementById("nav-"+l.id)?.classList.toggle("done",completed.includes(l.id)));let pct=Math.round(completed.length/lessons.length*100);document.getElementById("progressBar").style.width=pct+"%";document.getElementById("progressText").textContent=pct+"%"}
function renderQuiz(){let q=document.getElementById("quiz");q.innerHTML=quiz.map((item,i)=>`<div class="question"><p><b>${i+1}. ${item[0]}</b></p>${item[2].map((o,j)=>`<button class="option" name="quiz${i}" data-a="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}<div id="qf${i}" class="feedback"></div></div>`).join("");q.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{q.querySelectorAll('[name="'+btn.name+'"]').forEach(x=>x.classList.remove("selected"));btn.classList.add("selected")})}
function gradeQuiz(){let score=0;quiz.forEach((item,i)=>{let s=document.querySelector('[name="quiz'+i+'"].selected'),f=document.getElementById("qf"+i);if(s){let ok=Number(s.dataset.a)===item[3];if(ok)score++;f.textContent=ok?"✓ Correct":"✗ Review this concept";f.className="feedback "+(ok?"correct":"incorrect")}});let pct=Math.round(score/quiz.length*100);document.getElementById("score").textContent=`Score: ${score}/${quiz.length} (${pct}%)`;if(pct>=80){if(!completed.includes("2.8"))completed.push("2.8");localStorage.setItem("gsModule2Completed",JSON.stringify(completed));document.getElementById("completion").classList.add("show");updateProgress()}else document.getElementById("completion").classList.remove("show")}
renderNav();openLesson(0);
</script>
</body>
</html>
